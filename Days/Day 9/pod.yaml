apiVersion: v1 
kind: Pod
metadata: #Dictionary
  name: my-pod
  labels: #Nested Dictionary
    app: nginx
    environment: development
spec: #Dictionary
  containers: #List of dictionaries
    - name: nginx-container
      image: nginx:latest
      ports: #List 
        - containerPort: 80
    - name: sidecar-container
      image: busybox
      args: ["sleep", "3600"] #you can write it like this or the comment below
    # args:
    # - "sleep"
    # - "3600"
  