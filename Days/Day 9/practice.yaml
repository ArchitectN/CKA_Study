is_engineer: true #boolean
payment_dues: null #null

address: #dictionary
  street: "123 Main St" #string
  city: "Anytown" #string
  state: "CA" #string
  zip_code: 12345 #integer
  contact: #Nested dictionary
    phone: "555-1234" #string
    email: "

hobbies: #list
  - reading #string
  - hiking #string
